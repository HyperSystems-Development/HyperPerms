mod_name    = HyperPerms
mod_group   = com.hyperperms
mod_version = 2.10.0

java_version = 25

# Hytale channel (override on CLI: -Phytale_channel=pre-release)
# Options: release | pre-release
# Default is release so plain builds target the current Hytale release (0.5.6).
# Use -Phytale_channel=pre-release or ./gradlew buildPreRelease for the pre-release build (0.6.0-pre.x).
hytale_channel = release
