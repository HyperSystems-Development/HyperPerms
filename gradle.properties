mod_name    = HyperPerms
mod_group   = com.hyperperms
mod_version = 3.0.0

java_version = 25

# Hytale channel (override on CLI: -Phytale_channel=release)
# Options: release | pre-release
#
# Default is pre-release, targeting Hytale Update 6 (0.6.0-pre.x).
#
# 0.6.x is a HARD break: ServerPlayerListPlayer gained Spectating/LivesRemaining
# constructor parameters and PermissionProvider gained the abstract
# getUsersWithPermission(String), so this source tree no longer compiles against
# the 0.5.x release line. Use the 2.10.x branch for 0.5.x servers.
hytale_channel = pre-release
