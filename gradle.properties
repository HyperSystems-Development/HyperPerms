mod_name    = HyperPerms
mod_group   = com.hyperperms
mod_version = 2.9.5

java_version = 25

# Hytale channel (override on CLI: -Phytale_channel=pre-release)
# Options: release | pre-release
# Default is release so plain builds target the current Hytale release (0.5.2).
# Use -Phytale_channel=pre-release or ./gradlew buildPreRelease for pre-release builds.
hytale_channel = release
